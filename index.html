<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="O novo site do Flavinnho está chegando.">
    <title>Flavinnho — Em breve</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #111217; color: #f5f5f0; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 760px; padding: 64px 0; }
      .status { color: #bdf776; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 24px 0; font-size: clamp(48px, 11vw, 100px); letter-spacing: -.06em; line-height: 1; overflow-wrap: anywhere; }
      p { max-width: 460px; color: #b6b7c1; font-size: 20px; line-height: 1.6; }
      footer { margin-top: 80px; padding-top: 24px; border-top: 1px solid #303138; color: #858691; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <span class="status">Em breve</span>
      <h1>Flavinnho.</h1>
      <p>Um novo espaço está chegando.<br>Estamos preparando tudo por aqui.</p>
      <footer>Site em construção.</footer>
    </main>
  </body>
</html>
